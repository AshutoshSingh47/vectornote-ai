services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    command: pnpm --dir apps/frontend exec next dev -H 0.0.0.0 -p 3000
    env_file:
      - .env
    ports:
      - "3000:3000"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: pnpm --dir apps/backend exec tsx watch src/index.ts
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - redis
      - ollama

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: pnpm --dir apps/backend exec tsx watch src/workers/index.ts
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  redis-data:
  ollama-data:
